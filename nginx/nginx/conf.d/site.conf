# ----------------------------
# Gate 7: rate-limit & real-ip helpers
# Conservative default: ~300 req/min per IP → 5r/s
# tune rate/burst to your traffic patterns. This line should live in http{} context.
limit_req_zone $binary_remote_addr zone=ip_limit_zone:10m rate=5r/s;
# Optionally set the status returned for excess requests (default 503 on older nginx builds).
# limit_req_status 429;

# Include Cloudflare real-ip ranges and use CF-Connecting-IP as the real-ip header.
# Populate nginx/conf.d/cloudflare-realip.conf with ranges before enabling.
# See nginx/conf.d/cloudflare-realip.conf for TODO and link to Cloudflare IP list.
# To enable real-IP rewriting, uncomment the two lines below once you have populated the include file.
# include /etc/nginx/conf.d/cloudflare-realip.conf;
# real_ip_header CF-Connecting-IP;

# ----------------------------
# Gate 7: security headers (commented-safe; enable after validating app behavior)
# Add or enable the headers below to harden responses. HSTS is commented by default
# because enabling HSTS before full validation can lead to long-lived client behavior.
#
# Example safe defaults:
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
# Compact default CSP — highly service-specific; keep commented until audited.
# add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;
#
# HSTS: only enable after verifying all subdomains and no mixed-content issues.
# To enable (example for 6 months): add_header Strict-Transport-Security "max-age=15552000; includeSubDomains; preload" always;

# ----------------------------
# Gate 7: rate-limiting policy (light)
# Apply limit to primary entry points; skip health checks.
# The location for /healthz is exempted below.
#
# Conservative example: rate=5r/s (~300/min) with small burst.
location = /healthz {
	# Respond quickly for probes; bypass rate limiting and auth checks.
	add_header Content-Type text/plain;
	return 200 "OK\n";
}

# Apply limit to the main site root and other traffic locations (example).
location / {
	# Apply the zone defined above. Tune 'burst' and 'nodelay' to suit application.
	limit_req zone=ip_limit_zone burst=10 nodelay;
	# ...existing proxy/static handling...
	# proxy_pass ...;
}

