# Additional server block for cloudflared localhost connections
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  listen 127.0.0.1:443 ssl;
  listen [::1]:443 ssl;
  server_name localhost;

  # Use the same SSL certificates
  ssl_certificate     /etc/ssl/cloudflare-origin/origin.crt;
  ssl_certificate_key /etc/ssl/cloudflare-origin/origin.key;

  # Basic SSL settings
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305';
  ssl_prefer_server_ciphers off;

  root /var/www/html;
  index index.html;

  location /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}