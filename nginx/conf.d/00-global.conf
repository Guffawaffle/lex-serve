# Real IP from Cloudflare
real_ip_header CF-Connecting-IP;
set_real_ip_from 172.18.0.0/16;
set_real_ip_from 172.19.0.0/16;
set_real_ip_from 172.20.0.0/16;
set_real_ip_from 172.21.0.0/16;
set_real_ip_from 172.22.0.0/16;

# Standard Cloudflare log format
log_format main_cf '$remote_addr $http_x_forwarded_for '
                   '- $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

# HONEYTRAP: Comprehensive attack logging format (JSON)
log_format honeytrap escape=json '{'
  '"timestamp":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"x_forwarded_for":"$http_x_forwarded_for",'
  '"cf_connecting_ip":"$http_cf_connecting_ip",'
  '"cf_ipcountry":"$http_cf_ipcountry",'
  '"cf_ray":"$http_cf_ray",'
  '"cf_visitor":"$http_cf_visitor",'
  '"request_method":"$request_method",'
  '"request_uri":"$request_uri",'
  '"query_string":"$query_string",'
  '"server_protocol":"$server_protocol",'
  '"status":$status,'
  '"body_bytes_sent":$body_bytes_sent,'
  '"request_length":$request_length,'
  '"request_time":$request_time,'
  '"http_host":"$http_host",'
  '"http_referer":"$http_referer",'
  '"http_user_agent":"$http_user_agent",'
  '"http_accept":"$http_accept",'
  '"http_accept_language":"$http_accept_language",'
  '"http_accept_encoding":"$http_accept_encoding",'
  '"http_connection":"$http_connection",'
  '"http_cookie":"$http_cookie",'
  '"ssl_protocol":"$ssl_protocol",'
  '"ssl_cipher":"$ssl_cipher",'
  '"scheme":"$scheme",'
  '"attack_type":"$attack_type"'
'}';

# 404 logging format (JSON) for tracking probes that don't match honeytrap patterns
log_format notfound escape=json '{'
  '"timestamp":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"cf_connecting_ip":"$http_cf_connecting_ip",'
  '"cf_ipcountry":"$http_cf_ipcountry",'
  '"request_method":"$request_method",'
  '"request_uri":"$request_uri",'
  '"status":$status,'
  '"http_referer":"$http_referer",'
  '"http_user_agent":"$http_user_agent"'
'}';

# Attack type classification
map $request_uri $attack_type {
  default "unknown";
  ~*\.git "vcs_probe";
  ~*\.(hg|svn|bzr) "vcs_probe";
  ~*\.(env|htaccess|htpasswd|bak|backup|old|sql|zip|tar|gz) "config_probe";
  ~*/(wp-admin|wp-includes|wp-content|wordpress|xmlrpc\.php|wp-login\.php) "wordpress_probe";
  ~*/administrator "joomla_probe";
  ~*/media/system "joomla_probe";
  ~*/(admin|phpmyadmin|pma|mysql|adminer) "admin_probe";
  ~*\.(php|asp|aspx|jsp|cgi)$ "script_probe";
  ~*/(shell|cmd|exec|eval|system) "exploit_attempt";
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
