# ssh.smartergpt.dev - SSH Tarpit Proxy
#
# This routes ssh.smartergpt.dev to the endlessh-go tarpit container.
# The tarpit slowly sends random SSH banners to trap scanners indefinitely.
#
# CLOUDFLARE ZERO TRUST SETUP REQUIRED:
# 1. In Cloudflare Dashboard → Zero Trust → Access → Tunnels
# 2. Find your tunnel and add a public hostname:
#    - Subdomain: ssh
#    - Domain: smartergpt.dev
#    - Type: TCP
#    - URL: endlessh:2222
#
# This file handles HTTP(S) fallback for browser access.

server {
  listen 80;
  listen [::]:80;
  server_name ssh.smartergpt.dev;

  # Connection limits
  limit_conn conn_per_ip 10;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Inform users this is SSH only
  location / {
    default_type text/plain;
    return 200 'ssh.smartergpt.dev - SSH Access Only

This subdomain is for SSH connections only.
Connect via: ssh -p 22 user@ssh.smartergpt.dev

For web access, visit: https://smartergpt.dev
';
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ssh.smartergpt.dev;

  # Use same Cloudflare origin cert
  ssl_certificate     /etc/ssl/cloudflare-origin/origin.crt;
  ssl_certificate_key /etc/ssl/cloudflare-origin/origin.key;

  # TLS config
  ssl_session_timeout 1d;
  ssl_session_cache shared:MozSSL:10m;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
  ssl_prefer_server_ciphers off;

  # Connection limits
  limit_conn conn_per_ip 10;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Prometheus metrics from endlessh (internal only)
  # NOTE: This only works when endlessh container is running
  # Uncomment when using: docker compose up -d (with endlessh)
  # location /metrics {
  #   allow 172.16.0.0/12;
  #   allow 10.0.0.0/8;
  #   deny all;
  #   proxy_pass http://endlessh:2112/metrics;
  #   proxy_set_header Host $host;
  # }

  # Inform users this is SSH only
  location / {
    default_type text/html;
    return 200 '<!DOCTYPE html>
<html>
<head><title>SSH Access - smartergpt.dev</title></head>
<body style="font-family: monospace; padding: 2rem; background: #1a1a2e; color: #eee;">
<h1>🔐 ssh.smartergpt.dev</h1>
<p>This subdomain is for <strong>SSH connections only</strong>.</p>
<pre style="background: #16213e; padding: 1rem; border-radius: 4px;">
ssh -p 22 user@ssh.smartergpt.dev
</pre>
<p>For web access, visit: <a href="https://smartergpt.dev" style="color: #4cc9f0;">https://smartergpt.dev</a></p>
</body>
</html>';
  }

  access_log /var/log/nginx/access.log main_cf;
  error_log  /var/log/nginx/error.log warn;
}
