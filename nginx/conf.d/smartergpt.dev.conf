# Redirect 80 -> 443
server {
    listen 80;
    listen [::]:80;
    server_name smartergpt.dev www.smartergpt.dev;
    return 301 https://$host$request_uri;
}

# HTTPS origin for cloudflared
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name smartergpt.dev www.smartergpt.dev nginx;

    # Fixed paths (Nginx won't env-expand here)
    ssl_certificate     /etc/ssl/cloudflare-origin/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare-origin/origin.key;

    # Sensible TLS defaults
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # IMPORTANT: This path must match SITE_CONTAINER_PATH environment variable
    # Default: /usr/share/nginx/html (change both if you modify SITE_CONTAINER_PATH)
    root /usr/share/nginx/html;
    index index.html;

    # optional include if you have it
    include /etc/nginx/conf.d/includes/headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
