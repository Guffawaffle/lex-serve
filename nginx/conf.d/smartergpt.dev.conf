# smartergpt.dev - Hardened Nginx Configuration with Tarpit Protection
#
# ROUTING PRIORITY:
# 1. Real endpoints (healthz, static files) - FAST PATH
# 2. Honeypot endpoints - TARPIT (slow drip, bandwidth limited)
# 3. Attack patterns - 444 silent drop or slow 403
# 4. Everything else - normal static serving

# ═══════════════════════════════════════════════════════════════════════════
# HTTP (Port 80) - Redirect to HTTPS, catch attacks early
# ═══════════════════════════════════════════════════════════════════════════
server {
  listen 80;
  listen [::]:80;
  server_name smartergpt.dev www.smartergpt.dev;

  # Connection limits per IP (prevent resource exhaustion)
  limit_conn conn_per_ip 50;

  # Healthcheck endpoint (needed for container orchestration)
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # HONEYTRAP: Silent drop common attack patterns on HTTP
  location ~* /\.git { access_log /var/log/nginx/honeytrap.log honeytrap; return 444; }
  location ~ /\.(hg|svn|bzr|env|htaccess|htpasswd|bak|backup|old|sql|zip|tar|gz) {
    access_log /var/log/nginx/honeytrap.log honeytrap; return 444;
  }
  location ~* ^/(wp-admin|wp-includes|wp-content|wordpress|xmlrpc\.php|wp-login\.php) {
    access_log /var/log/nginx/honeytrap.log honeytrap; return 444;
  }

  # Redirect everything else to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ═══════════════════════════════════════════════════════════════════════════
# HTTPS (Port 443) - Main site with tarpit protection
# ═══════════════════════════════════════════════════════════════════════════
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name smartergpt.dev www.smartergpt.dev;

  # Cloudflare Origin Certificate
  ssl_certificate     /etc/ssl/cloudflare-origin/origin.crt;
  ssl_certificate_key /etc/ssl/cloudflare-origin/origin.key;

  # TLS Configuration (Mozilla Intermediate)
  ssl_session_timeout 1d;
  ssl_session_cache shared:MozSSL:10m;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
  ssl_prefer_server_ciphers off;

  # Connection limits (prevent resource exhaustion)
  limit_conn conn_per_ip 50;           # Max 50 connections per IP
  limit_conn conn_per_server 1000;     # Max 1000 total connections

  # Global bandwidth cap: 1 Mbps (131072 bytes/s) per connection
  # This prevents any single connection from saturating bandwidth
  limit_rate 131072;

  # Security Headers
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; frame-ancestors 'self';" always;

  root /var/www/html;
  index index.html;

  # ─────────────────────────────────────────────────────────────────────────
  # PRIORITY 1: Real endpoints (FAST PATH - no tarpit)
  # ─────────────────────────────────────────────────────────────────────────

  # Healthcheck endpoint
  location = /healthz {
    access_log off;
    limit_rate 0;  # No bandwidth limit for health checks
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # ─────────────────────────────────────────────────────────────────────────
  # PRIORITY 2: Honeypot endpoints (TARPIT - slow drip response)
  # These look like real endpoints but trap attackers with slow responses
  # ─────────────────────────────────────────────────────────────────────────

  # Fake login pages (tarpit: 128 bytes/s = ~8 seconds per KB)
  location = /admin.php {
    access_log /var/log/nginx/honeytrap.log honeytrap;
    limit_req zone=tarpit_rate burst=1 nodelay;
    limit_rate 128;
    default_type text/html;
    return 200 '<!DOCTYPE html><html><head><title>Admin Login</title></head><body><h1>Loading administration panel...</h1><p>Please wait while we verify your session...</p><p>Authenticating credentials...</p><p>Checking permissions...</p><p>Loading dashboard modules...</p><p>Initializing security protocols...</p><p>Verifying two-factor authentication...</p><p>Session validation in progress...</p></body></html>';
  }

  location = /login.php {
    access_log /var/log/nginx/honeytrap.log honeytrap;
    limit_req zone=tarpit_rate burst=1 nodelay;
    limit_rate 128;
    default_type text/html;
    return 200 '<!DOCTYPE html><html><head><title>Login</title></head><body><h1>Authentication in progress...</h1><p>Validating session token...</p><p>Checking database connection...</p><p>Verifying user credentials...</p><p>Loading user profile...</p><p>Establishing secure connection...</p><p>Preparing dashboard...</p><p>Almost there...</p></body></html>';
  }

  location = /wp-login.php {
    access_log /var/log/nginx/honeytrap.log honeytrap;
    limit_req zone=tarpit_rate burst=1 nodelay;
    limit_rate 128;
    default_type text/html;
    return 200 '<!DOCTYPE html><html><head><title>WordPress Login</title></head><body><h1>WordPress</h1><p>Loading login form...</p><p>Connecting to database...</p><p>Checking site configuration...</p><p>Loading plugins...</p><p>Initializing security...</p></body></html>';
  }

  location = /administrator/index.php {
    access_log /var/log/nginx/honeytrap.log honeytrap;
    limit_req zone=tarpit_rate burst=1 nodelay;
    limit_rate 128;
    default_type text/html;
    return 200 '<!DOCTYPE html><html><head><title>Administrator</title></head><body><h1>Joomla Administration</h1><p>Loading administrator panel...</p><p>Checking permissions...</p></body></html>';
  }

  # ─────────────────────────────────────────────────────────────────────────
  # PRIORITY 3: Attack patterns (slow 403 or silent 444)
  # Rate limited + bandwidth throttled to waste attacker time
  # ─────────────────────────────────────────────────────────────────────────

  # VCS metadata probes (slow 403)
  location ~* /\.git {
    access_log /var/log/nginx/honeytrap.log honeytrap;
    limit_req zone=tarpit_rate burst=1 nodelay;
    limit_rate 64;  # Extra slow: 64 bytes/s
    return 403 "Access denied. This incident has been logged and reported.\n";
  }

  # Config file probes
  location ~ /\.(hg|svn|bzr|env|htaccess|htpasswd|smartergpt|bak|backup|old|sql|zip|tar|gz) {
    access_log /var/log/nginx/honeytrap.log honeytrap;
    limit_req zone=tarpit_rate burst=1 nodelay;
    limit_rate 64;
    return 403 "Access denied. Security scan detected.\n";
  }

  # CMS/WordPress probes
  location ~* ^/(wp-admin|wp-includes|wp-content|wordpress|xmlrpc\.php) {
    access_log /var/log/nginx/honeytrap.log honeytrap;
    limit_req zone=tarpit_rate burst=1 nodelay;
    limit_rate 64;
    return 403 "WordPress is not installed on this server.\n";
  }

  # Admin panel probes
  location ~* ^/(admin|phpmyadmin|pma|mysql|adminer|console|cpanel|webmail|administrator) {
    access_log /var/log/nginx/honeytrap.log honeytrap;
    limit_req zone=tarpit_rate burst=1 nodelay;
    limit_rate 64;
    return 403 "Access denied. Administrative access requires VPN.\n";
  }

  # Script file probes (PHP, ASP, etc.)
  location ~* \.(php|asp|aspx|jsp|cgi|pl|py|sh|bash)$ {
    access_log /var/log/nginx/honeytrap.log honeytrap;
    limit_req zone=tarpit_rate burst=1 nodelay;
    limit_rate 64;
    return 403 "Server-side scripting is disabled.\n";
  }

  # Exploit pattern detection (silent drop - waste no resources)
  location ~* /(shell|cmd|exec|eval|system|upload|backdoor|c99|r57|webshell) {
    access_log /var/log/nginx/honeytrap.log honeytrap;
    return 444;  # Silent connection drop
  }

  # ─────────────────────────────────────────────────────────────────────────
  # PRIORITY 4: Normal static file serving
  # ─────────────────────────────────────────────────────────────────────────

  # Static file handling (must come after honeytrap rules)
  location / {
    limit_req zone=per_ip burst=30 nodelay;
    limit_rate 0;  # No limit for real content
    try_files $uri $uri/ =404;
  }

  # Static assets with caching (fast path)
  location ~* \.(css|js|woff2?|svg|gif|png|jpg|jpeg|ico|webp)$ {
    limit_rate 0;  # No limit for assets
    expires 6M;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  access_log /var/log/nginx/access.log main_cf;
  error_log  /var/log/nginx/error.log warn;
}

# ═══════════════════════════════════════════════════════════════════════════
# CATCH-ALL: Unknown hosts get silent drop
# This catches requests that don't match any server_name
# ═══════════════════════════════════════════════════════════════════════════
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name _;

  # Use same cert (Cloudflare origin cert)
  ssl_certificate     /etc/ssl/cloudflare-origin/origin.crt;
  ssl_certificate_key /etc/ssl/cloudflare-origin/origin.key;

  # Log unknown host requests to honeytrap
  access_log /var/log/nginx/honeytrap.log honeytrap;

  # Silent drop everything
  location / {
    return 444;
  }
}
