# smartergpt.dev - Hardened Nginx Configuration

server {
  listen 80;
  listen [::]:80;
  server_name smartergpt.dev www.smartergpt.dev;

  # Healthcheck endpoint (needed for container orchestration)
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # HONEYTRAP: Catch common attack patterns on HTTP
  location ~* /\.git { access_log /var/log/nginx/honeytrap.log honeytrap; return 444; }
  location ~ /\.(hg|svn|bzr|env|htaccess|htpasswd|bak|backup|old|sql|zip|tar|gz) {
    access_log /var/log/nginx/honeytrap.log honeytrap; return 444;
  }
  location ~* ^/(wp-admin|wp-includes|wp-content|wordpress|xmlrpc\.php|wp-login\.php) {
    access_log /var/log/nginx/honeytrap.log honeytrap; return 444;
  }

  # Redirect everything else to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name smartergpt.dev www.smartergpt.dev;

  # Cloudflare Origin Certificate
  ssl_certificate     /etc/ssl/cloudflare-origin/origin.crt;
  ssl_certificate_key /etc/ssl/cloudflare-origin/origin.key;

  # TLS Configuration (Mozilla Intermediate)
  ssl_session_timeout 1d;
  ssl_session_cache shared:MozSSL:10m;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
  ssl_prefer_server_ciphers off;

  # Security Headers
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; frame-ancestors 'self';" always;

  root /var/www/html;
  index index.html;

  # Healthcheck endpoint
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # VCS metadata probes
  location ~* /\.git {
    access_log /var/log/nginx/honeytrap.log honeytrap;
    limit_rate 512;
    limit_req zone=per_ip burst=2 nodelay;
    return 403 "Access denied.\n";
  }

  # Config file probes
  location ~ /\.(hg|svn|bzr|env|htaccess|htpasswd|smartergpt|bak|backup|old|sql|zip|tar|gz) {
    access_log /var/log/nginx/honeytrap.log honeytrap;
    limit_rate 512;
    return 403 "Access denied.\n";
  }

  # CMS/WordPress probes
  location ~* ^/(wp-admin|wp-includes|wp-content|wordpress|xmlrpc\.php|wp-login\.php) {
    access_log /var/log/nginx/honeytrap.log honeytrap;
    limit_rate 512;
    return 403 "Access denied.\n";
  }

  # Admin panel probes
  location ~* ^/(admin|phpmyadmin|pma|mysql|adminer|console|cpanel|webmail|administrator) {
    access_log /var/log/nginx/honeytrap.log honeytrap;
    limit_rate 512;
    return 403 "Access denied.\n";
  }

  # Script file probes
  location ~* \.(php|asp|aspx|jsp|cgi|pl|py|sh|bash)$ {
    access_log /var/log/nginx/honeytrap.log honeytrap;
    limit_rate 512;
    return 403 "Access denied.\n";
  }

  # Exploit pattern detection
  location ~* /(shell|cmd|exec|eval|system|upload|backdoor) {
    access_log /var/log/nginx/honeytrap.log honeytrap;
    limit_rate 256;
    return 403 "Access denied.\n";
  }

  # Honeypot endpoints
  location = /admin.php {
    access_log /var/log/nginx/honeytrap.log honeytrap;
    return 200 "Loading...\n";
  }

  location = /login.php {
    access_log /var/log/nginx/honeytrap.log honeytrap;
    return 200 "Authenticating...\n";
  }

  # Static file handling (must come after honeytrap)
  location / {
    limit_req zone=per_ip burst=30 nodelay;
    try_files $uri $uri/ =404;
  }

  # Static assets with caching
  location ~* \.(css|js|woff2?|svg|gif|png|jpg|jpeg|ico|webp)$ {
    expires 6M;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  access_log /var/log/nginx/access.log main_cf;
  error_log  /var/log/nginx/error.log warn;
}
