name: compose-preflight

on:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.override.yml'
      - 'nginx/**'
      - 'cloudflared/**'
      - 'Makefile'
  push:
    branches: [ main, master ]

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        run: docker version && docker compose version

      - name: Compose config validation
        run: COMPOSE_PROJECT_NAME=smartergpt docker compose config > /dev/null

      - name: Spin up nginx only
        run: |
          COMPOSE_PROJECT_NAME=smartergpt docker compose up -d nginx
          sleep 3

      - name: Nginx config test
        run: COMPOSE_PROJECT_NAME=smartergpt docker compose exec nginx nginx -t

      - name: Health probe (HTTP)
        run: COMPOSE_PROJECT_NAME=smartergpt docker compose exec nginx curl -fsS http://localhost/healthz

      - name: Logs (on failure)
        if: failure()
        run: COMPOSE_PROJECT_NAME=smartergpt docker compose logs --no-color

      - name: Teardown
        if: always()
        run: COMPOSE_PROJECT_NAME=smartergpt docker compose down -v --remove-orphans
