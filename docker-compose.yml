name: smartergpt

services:
  nginx:
    image: nginx:1.26-alpine
    env_file:
      - path: .env
        required: false
    expose:
      - "80"
      - "443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl/cloudflare-origin:/etc/ssl/cloudflare-origin:ro
      # IMPORTANT: If you change SITE_CONTAINER_PATH from default (/usr/share/nginx/html),
      # you must also update the 'root' directive in nginx/conf.d/smartergpt.dev.conf
      - ${SITE_HOST_PATH:-/srv/www/smartergpt}:${SITE_CONTAINER_PATH:-/usr/share/nginx/html}:ro
      - ./nginx/logs:/var/log/nginx
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - smartergpt-edge-net
    labels:
      com.smartergpt.role: "edge"

  cloudflared:
    image: cloudflare/cloudflared:2025.1.0
    env_file:
      - path: .env
        required: false
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./ssl/cloudflare-origin:/etc/ssl/cloudflare-origin:ro
    environment:
      TZ: ${TZ:-UTC}
      DOMAIN: ${DOMAIN:-smartergpt.dev}
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    depends_on:
      nginx:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - smartergpt-edge-net
    labels:
      com.smartergpt.role: "tunnel"

networks:
  smartergpt-edge-net:
    name: smartergpt-edge-net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
