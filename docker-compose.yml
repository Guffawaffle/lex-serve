# lex-serve Docker Compose - Hardened Configuration
name: lex-serve

x-common-labels: &common_labels
  com.smartergpt.project: lex-serve
  org.opencontainers.image.version: ${BUILD_ID:-dev}
  org.opencontainers.image.revision: ${GIT_SHA:-local}

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # NGINX - Edge reverse proxy (hardened)
  # ═══════════════════════════════════════════════════════════════════════════
  nginx:
    image: nginx:1.26-alpine
    env_file: [.env]
    expose: ["80", "443"]
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl/cloudflare-origin:/etc/ssl/cloudflare-origin:ro
      - /srv/www/smartergpt/public:/var/www/html:ro
      - ./nginx/logs:/var/log/nginx
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "wget -qO- http://localhost/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks: [lex-serve-net]
    labels:
      <<: *common_labels
      com.smartergpt.role: "edge"

  # ═══════════════════════════════════════════════════════════════════════════
  # ENDLESSH - SSH Tarpit (traps SSH scanners indefinitely)
  # Routes: ssh.smartergpt.dev → this service
  # ═══════════════════════════════════════════════════════════════════════════
  endlessh:
    image: shizunge/endlessh-go:latest
    command:
      - -logtostderr
      - -v=1
      - -port=2222
      - -interval_ms=10000       # 10 second delay between lines
      - -line_length=32          # Max banner line length
      - -max_clients=4096        # Max concurrent trapped clients
      - -enable_prometheus       # Enable metrics export
      - -prometheus_port=2112
      - -geoip_supplier=ip-api   # GeoIP for dashboard (uses free ip-api.com)
    expose: ["2222", "2112"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: "0.1"
    restart: unless-stopped
    networks: [lex-serve-net]
    labels:
      <<: *common_labels
      com.smartergpt.role: "tarpit"

  # ═══════════════════════════════════════════════════════════════════════════
  # CLOUDFLARED - Tunnel to Cloudflare (token mode, hardened)
  # ═══════════════════════════════════════════════════════════════════════════
  cloudflared:
    image: cloudflare/cloudflared:latest
    env_file: [.env]
    environment:
      TZ: ${TZ:-UTC}
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${TUNNEL_TOKEN:?TUNNEL_TOKEN required}"]
    depends_on:
      nginx:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks: [lex-serve-net]
    labels:
      <<: *common_labels
      com.smartergpt.role: "tunnel"

  # ═══════════════════════════════════════════════════════════════════════════
  # NEXTCLOUD SERVICES (optional - use --profile nextcloud)
  # ═══════════════════════════════════════════════════════════════════════════
  db:
    image: mariadb:10.11
    profiles: [nextcloud]
    command: >
      --transaction-isolation=READ-COMMITTED
      --binlog-format=ROW
      --skip-name-resolve=1
    env_file: [./nextcloud.env]
    volumes:
      - db:/var/lib/mysql
      - ./mariadb/zz-tune.cnf:/etc/mysql/conf.d/zz-tune.cnf:ro
    restart: unless-stopped
    networks: [lex-serve-net]
    labels:
      <<: *common_labels
      com.smartergpt.role: "database"

  nextcloud:
    image: nextcloud:fpm
    profiles: [nextcloud]
    depends_on: [db]
    env_file: [./nextcloud.env]
    environment:
      - MYSQL_HOST=db
      - NEXTCLOUD_DATA_DIR=/var/www/html/data
    volumes:
      - nextcloud:/var/www/html
      - /srv/storage/expansion5tb/nextcloud-data:/var/www/html/data
    restart: unless-stopped
    networks: [lex-serve-net]
    labels:
      <<: *common_labels
      com.smartergpt.role: "app"

  nextcloud-cron:
    image: nextcloud:fpm
    profiles: [nextcloud]
    depends_on: [db, nextcloud]
    entrypoint: /cron.sh
    volumes:
      - nextcloud:/var/www/html
      - /srv/storage/expansion5tb/nextcloud-data:/var/www/html/data
    restart: unless-stopped
    networks: [lex-serve-net]
    labels:
      <<: *common_labels
      com.smartergpt.role: "cron"

networks:
  lex-serve-net:
    name: lex-serve-net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"

volumes:
  nextcloud:
  db:

# USAGE:
#   Default (static site only): docker compose up -d
#   With Nextcloud:             docker compose --profile nextcloud up -d
